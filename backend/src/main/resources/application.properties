spring.application.name=backend_syndic

# Configuration database

# Database URL
spring.datasource.url=${MYSQL_URL:jdbc:mysql://db:3306/easysyndic?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}

# Username for MySQL
spring.datasource.username=${MYSQL_USER:root}

# Password for MySQL
spring.datasource.password=${MYSQL_PASSWORD}

# JPA settings

# Automatically update the database schema
spring.jpa.hibernate.ddl-auto=update

# Show SQL in console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Allow bean definition overriding to prevent context loading errors
spring.main.allow-bean-definition-overriding=true

# Mail Configuration (Gmail SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Gemini AI Configuration
gemini.api.key=${GEMINI_API_KEY}
gemini.api.model=gemini-1.5-flash
gemini.api.system-prompt=You are a professional Moroccan building Syndic. Write a formal, polite email in Arabic to an owner. Mention the specific charge type, the amount in MAD, and the period. Use professional Moroccan administrative etiquette.


# Increase max request size to 10MB to allow Base64 images/PDFs
server.tomcat.max-http-post-size=10485760
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
