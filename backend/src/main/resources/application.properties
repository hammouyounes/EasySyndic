spring.application.name=backend_syndic

# Configuration database

# Database URL
spring.datasource.url=jdbc:mysql://localhost:3306/EasySyndic?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true

# Username for MySQL
spring.datasource.username=root

# Password for MySQL
spring.datasource.password=

# JPA settings

# Automatically update the database schema
spring.jpa.hibernate.ddl-auto=update

# Show SQL in console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Allow bean definition overriding to prevent context loading errors
spring.main.allow-bean-definition-overriding=true

# Mail Configuration (Dummy for development to satisfy JavaMailSender dependency)
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

