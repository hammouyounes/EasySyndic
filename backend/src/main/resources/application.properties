spring.application.name=backend_syndic

# Configuration database

# Database URL
spring.datasource.url=jdbc:mysql://localhost:3306/EasySyndic?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true

# Username for MySQL
spring.datasource.username=root

# Password for MySQL
spring.datasource.password=1234

# JPA settings

# Automatically update the database schema
spring.jpa.hibernate.ddl-auto=update

# Show SQL in console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Allow bean definition overriding to prevent context loading errors
spring.main.allow-bean-definition-overriding=true

